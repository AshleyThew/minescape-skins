name: Release skins

on:
  push:
    branches: [main]
    paths:
      - 'skins/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Re-upload every skin to MineSkin (rarely correct)'
        type: boolean
        default: false

permissions:
  contents: write

# Each run reads the manifest the previous run published, so two runs must not overlap.
concurrency:
  group: skins-release
  cancel-in-progress: false

jobs:
  release:
    name: Upload changed skins and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skins
        run: python tools/validate.py

      # The manifest is not in git - main takes pull requests only, so CI cannot commit
      # to it. The latest release asset is the store, and it is what the next diff is
      # taken against.
      - name: Fetch the published manifest
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "${{ github.repository }}" \
               --pattern manifest.json --output baseline.json 2>/dev/null; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Baseline: $(python -c "import json;print(len(json.load(open('baseline.json'))['skins']))") skins"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No previous release - every skin will be uploaded."
          fi

      - name: Upload changed skins and build the manifest
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
        run: |
          args="--upload --output manifest.json"
          if [ "${{ steps.baseline.outputs.found }}" = "true" ]; then
            args="$args --baseline baseline.json"
          fi
          if [ "${{ inputs.force_all }}" = "true" ]; then
            args="$args --force-all"
          fi
          python tools/build_manifest.py $args

      # No new manifest means nothing changed, so the current release already describes
      # these images and republishing would make every server re-download it.
      - name: Decide whether to release
        id: decide
        run: |
          if [ -f manifest.json ]; then
            echo "release=true" >> $GITHUB_OUTPUT
          else
            echo "release=false" >> $GITHUB_OUTPUT
            echo "Nothing changed - keeping the current release."
          fi

      - name: Compute digest
        if: steps.decide.outputs.release == 'true'
        run: |
          sha256sum manifest.json | cut -d' ' -f1 > manifest.json.sha256
          echo "manifest.json sha256: $(cat manifest.json.sha256)"

      - name: Set release tag
        id: tag
        if: steps.decide.outputs.release == 'true'
        run: echo "tag=skins-$(date -u +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Skins ${{ steps.tag.outputs.tag }}
          body: |
            Skin manifest published from `${{ github.sha }}`.

            The server plugin fetches these two assets and refuses the manifest
            unless its SHA-256 matches:

            - `manifest.json`
            - `manifest.json.sha256`

            Stable URLs:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json.sha256
            ```
          files: |
            manifest.json
            manifest.json.sha256
          draft: false
          prerelease: false
