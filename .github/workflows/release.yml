name: Release skins

on:
  push:
    branches: [main]
    paths:
      - 'skins/**'
      - 'manifest.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skins-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish the manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skins
        run: python tools/validate.py

      # main takes pull requests only, so nothing is uploaded or committed here - the PR
      # already did that. This just refuses to publish a manifest that does not describe
      # the images beside it.
      - name: Verify the manifest matches the images
        run: python tools/build_manifest.py --verify

      # A run triggered by a workflow file or manifest-only change should not mint a
      # release identical to the last one.
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "No release exists yet - publishing."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "release=true" >> $GITHUB_OUTPUT
            echo "Manual run - publishing."
          elif git diff --quiet HEAD^ HEAD -- manifest.json; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "manifest.json unchanged in this push - skipping."
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      - name: Compute digest
        if: steps.decide.outputs.release == 'true'
        run: |
          sha256sum manifest.json | cut -d' ' -f1 > manifest.json.sha256
          echo "manifest.json sha256: $(cat manifest.json.sha256)"

      - name: Set release tag
        id: tag
        if: steps.decide.outputs.release == 'true'
        run: echo "tag=skins-$(date -u +%Y%m%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Skins ${{ steps.tag.outputs.tag }}
          body: |
            Skin manifest published from `${{ github.sha }}`.

            The server plugin fetches these two assets and refuses the manifest
            unless its SHA-256 matches:

            - `manifest.json`
            - `manifest.json.sha256`

            Stable URLs:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json.sha256
            ```
          files: |
            manifest.json
            manifest.json.sha256
          draft: false
          prerelease: false
