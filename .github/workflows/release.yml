name: Release skins

on:
  push:
    branches: [main]
    paths:
      - 'skins/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Re-upload every skin to MineSkin (rarely correct)'
        type: boolean
        default: false

permissions:
  contents: write

# Each pass reads the manifest the previous one published, so two runs must not overlap.
concurrency:
  group: skins-release
  cancel-in-progress: false

jobs:
  release:
    name: Upload changed skins and publish
    runs-on: ubuntu-latest
    # Room for three quota windows plus the uploads themselves.
    timeout-minutes: 260

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skins
        run: python tools/validate.py

      # The key allows 100 uploads an hour, so a batch larger than that cannot finish in
      # one pass. Rather than a clock-driven job firing hourly whether or not there is
      # anything to do, the run continues itself: upload what the quota allows, publish
      # it, wait exactly as long as the API asked, go again. A run with nothing to do
      # finishes in seconds and publishes nothing.
      - name: Upload changed skins and publish
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          MAX_PASSES=3
          final=0

          for pass in $(seq 1 $MAX_PASSES); do
            echo "::group::Upload pass $pass of $MAX_PASSES"
            rm -f manifest.json retry_after.txt

            # The published manifest is the store - main takes pull requests only, so CI
            # cannot commit one. Each pass diffs against the last published copy.
            args="--upload --output manifest.json --retry-file retry_after.txt"
            if gh release download --repo "$GITHUB_REPOSITORY" \
                 --pattern manifest.json --output baseline.json --clobber 2>/dev/null; then
              echo "baseline: $(python -c "import json;print(len(json.load(open('baseline.json'))['skins']))") skins"
              args="$args --baseline baseline.json"
            else
              echo "no previous release - every skin will be uploaded"
            fi
            if [ "$FORCE_ALL" = "true" ]; then
              args="$args --force-all"
            fi

            set +e
            python tools/build_manifest.py $args
            code=$?
            set -e
            echo "::endgroup::"

            # Publish before any wait, so progress survives even if the job is cut short.
            if [ -f manifest.json ]; then
              sha256sum manifest.json | cut -d' ' -f1 > manifest.json.sha256
              tag="skins-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${pass}"
              gh release create "$tag" manifest.json manifest.json.sha256 \
                --repo "$GITHUB_REPOSITORY" \
                --title "Skins $tag" \
                --notes "Skin manifest published from \`$GITHUB_SHA\`.

          The server plugin fetches both assets and refuses the manifest unless its SHA-256 matches:

          - \`manifest.json\`
          - \`manifest.json.sha256\`

          Stable URLs:
          \`\`\`
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json.sha256
          \`\`\`"
              echo "published $tag"
            else
              echo "nothing to publish this pass"
            fi

            # Anything other than 75 is final: success, or a real failure worth reporting.
            if [ "$code" != "75" ]; then
              final=$code
              break
            fi

            if [ "$pass" = "$MAX_PASSES" ]; then
              echo "::warning::Still more to upload after $MAX_PASSES passes - re-run this workflow to continue."
              break
            fi

            wait=$(cat retry_after.txt 2>/dev/null || echo 3600)
            echo "MineSkin quota reached - waiting ${wait}s for the window to reset, then continuing."
            sleep "$((wait + 30))"
          done

          exit $final
