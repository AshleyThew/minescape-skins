name: Release skins

on:
  push:
    branches: [main]
    paths:
      - 'skins/**'
      - 'pending/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Re-upload every skin to MineSkin (rarely correct)'
        type: boolean
        default: false
      allow_replacements:
        description: 'Allow this run to replace more than 50 existing skins (a deliberate redraw)'
        type: boolean
        default: false

permissions:
  contents: write

# Each run reads the manifest the previous one published, so two runs must not overlap.
concurrency:
  group: skins-release
  cancel-in-progress: false

jobs:
  release:
    name: Upload changed skins and publish
    runs-on: ubuntu-latest
    # One quota window's uploads (100 at about 20 a minute) and nothing else.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate skins
        run: python tools/validate.py

      # The key allows 100 uploads an hour, so a batch larger than that cannot finish in
      # one run. The run never sleeps waiting for the quota - that would hold a runner idle
      # for up to an hour per window. It uploads what the quota allows, publishes that, and
      # finishes; a warning says when the quota resets, and running
      # this workflow again from then picks up where it stopped. A run with nothing to do
      # finishes in seconds and publishes nothing.
      - name: Upload changed skins and publish
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
          ALLOW_REPLACEMENTS: ${{ inputs.allow_replacements }}
        run: |
          rm -f manifest.json retry_after.txt

          # The published manifest is the store - main takes pull requests only, so CI
          # cannot commit one. Each run diffs against the last published copy.
          args="--upload --output manifest.json --retry-file retry_after.txt"
          if gh release download --repo "$GITHUB_REPOSITORY" \
               --pattern manifest.json --output baseline.json --clobber 2>/dev/null; then
            echo "baseline: $(python -c "import json;print(len(json.load(open('baseline.json'))['skins']))") skins"
            args="$args --baseline baseline.json"
          else
            echo "no previous release - every skin will be uploaded"
          fi
          if [ "$FORCE_ALL" = "true" ]; then
            args="$args --force-all"
          fi
          if [ "$ALLOW_REPLACEMENTS" = "true" ]; then
            args="$args --allow-replacements"
          fi

          set +e
          python tools/build_manifest.py $args
          code=$?
          set -e

          if [ -f manifest.json ]; then
            sha256sum manifest.json | cut -d' ' -f1 > manifest.json.sha256
            tag="skins-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            gh release create "$tag" manifest.json manifest.json.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "Skins $tag" \
              --notes "Skin manifest published from \`$GITHUB_SHA\`.

          The server plugin fetches both assets and refuses the manifest unless its SHA-256 matches:

          - \`manifest.json\`
          - \`manifest.json.sha256\`

          Stable URLs:
          \`\`\`
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json
          https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json.sha256
          \`\`\`"
            echo "published $tag"
          else
            echo "nothing to publish this run"
          fi

          # 75 means this went fine and there is more to do: say so and finish green.
          if [ "$code" = "75" ]; then
            wait=$(cat retry_after.txt 2>/dev/null || echo 3600)
            echo "::warning::MineSkin quota reached - more skins still to upload. Run this workflow again in about $(( (wait + 59) / 60 )) minute(s) (with the same options) to continue."
            exit 0
          fi
          exit $code

      # Browsers cannot read release assets - GitHub sends no CORS header on them - so web
      # tools like the dialogue editor read this copy from raw.githubusercontent.com instead.
      # The branch is a single orphan commit, force-pushed, so it never builds up history.
      # Runs even after a failed upload step, since it may still have published.
      - name: Mirror manifest to the manifest branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir mirror
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'manifest.json*' --dir mirror

          if git fetch --depth 1 origin manifest 2>/dev/null &&
             [ "$(git show FETCH_HEAD:manifest.json.sha256)" = "$(cat mirror/manifest.json.sha256)" ]; then
            echo "manifest branch already matches the latest release"
            exit 0
          fi

          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          cd mirror
          git init -q -b manifest
          git add manifest.json manifest.json.sha256
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Manifest from $tag"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" manifest
          echo "mirrored $tag to the manifest branch"
