name: Validate

on:
  pull_request:
    branches: [main]

# Reads the repo and writes one comment. It deliberately holds no MineSkin key and
# pushes nothing: uploads happen after merge, so a pull request that is revised ten
# times or closed unmerged never costs quota.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: skins-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check skin images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Never fails the job directly - the report is posted to the PR first, so a
      # contributor sees which files are wrong rather than just a red cross.
      - name: Validate skins
        id: validate
        continue-on-error: true
        run: python tools/validate.py --markdown "$RUNNER_TEMP/report.md"

      # Runs whether validation passed or failed. A clean PR gets no comment, but one that
      # was failing and has been fixed sees its report flip to "passed" instead of leaving
      # a stale wall of errors behind.
      - name: Report validation to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- skins-validate -->'
          FAILED: ${{ steps.validate.outcome == 'failure' }}
        run: |
          printf '%s\n\n' "$MARKER" | cat - "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/comment.md"
          # One sticky comment per PR: update the previous report instead of stacking new ones.
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          elif [ "$FAILED" = "true" ]; then
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            echo "Validation passed and there is no previous report to update - no comment needed."
          fi

      - name: Fail on invalid skins
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Skin validation failed - see the comment on this pull request." >&2
          exit 1

      # Read-only preview of what merging would send to MineSkin, diffed against the
      # manifest the latest release published. No API key, nothing uploaded.
      - name: Report what merging would upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download --repo "${{ github.repository }}" \
               --pattern manifest.json --output "$RUNNER_TEMP/baseline.json" 2>/dev/null; then
            python tools/build_manifest.py --check --baseline "$RUNNER_TEMP/baseline.json"
          else
            echo "No release yet - every skin would be uploaded on merge."
          fi
