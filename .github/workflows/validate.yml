name: Validate

on:
  pull_request:
    branches: [main]

# main only accepts pull requests, so the manifest has to be brought up to date here
# rather than pushed to main afterwards. Writing to the PR branch needs contents: write,
# and the validation report needs pull-requests: write.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skins-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check skin images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.BOT_SECRET || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Never fails the job directly - the report is posted to the PR first, so a
      # contributor sees which files are wrong rather than just a red cross.
      - name: Validate skins
        id: validate
        continue-on-error: true
        run: python tools/validate.py --markdown "$RUNNER_TEMP/report.md"

      - name: Report validation to the pull request
        if: steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: '<!-- skins-validate -->'
        run: |
          printf '%s\n\n' "$MARKER" | cat - "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/comment.md"
          # One sticky comment per PR: update the previous report instead of stacking new ones.
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          fi

      - name: Fail on invalid skins
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Skin validation failed - see the comment on this pull request." >&2
          exit 1

      # A fork's workflow gets no secrets and cannot push, so it only reports.
      - name: Report pending uploads
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          python tools/build_manifest.py --check
          echo "Fork PR: the manifest must be updated by a maintainer before this can merge."

      - name: Upload changed skins and update the manifest
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          MINESKIN_API_KEY: ${{ secrets.MINESKIN_API_KEY }}
        run: python tools/build_manifest.py --upload

      - name: Commit the manifest to this pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'MineScape-Bot'
          git config user.email 'bot@minescape.me'
          if git diff --quiet -- manifest.json; then
            echo "Manifest already up to date."
          else
            git add manifest.json
            git commit -m "Update skin manifest"
            git push origin HEAD:${{ github.head_ref }}
            echo "Pushed an updated manifest - review the texture/signature diff before merging."
          fi

      # Guards the merge: main publishes straight from the committed manifest.
      - name: Verify the manifest matches the images
        run: python tools/build_manifest.py --verify
